name: Deterministic Quality

on:
  workflow_call:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  quality:
    name: Build & Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true
      - uses: taiki-e/install-action@just
      - name: Install dependencies
        run: just install-dev-tools
      - name: Run deterministic quality gates
        run: just quality
