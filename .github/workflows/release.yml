name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  quality:
    name: Deterministic quality gates
    uses: ./.github/workflows/quality.yml

  release:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'

      - name: Record release commit and completed gates
        run: |
          commit="$(git rev-parse HEAD)"
          echo "Release commit: ${commit}"
          {
            echo "### Release gates"
            echo "- Commit: `${commit}`"
            echo "- Deterministic quality: passed"
            echo "- Environment-dependent Flatpak smoke: pending"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y flatpak

      - name: Build Flatpak bundle
        env:
          CGO_ENABLED: "0"
        run: go test -tags=integration ./flatpaktest -count=1 -v -timeout=60m

      - name: Record completed environment gate
        run: echo "- Environment-dependent Flatpak smoke: passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Attach Flatpak bundle to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" dist/flatpak/perfuncted.flatpak --clobber

      - name: Generate GitHub release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(gh api -X POST \
            /repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="${{ github.ref_name }}" \
            -q .body)
          RELEASE_ID=$(gh api /repos/${{ github.repository }}/releases/tags/${{ github.ref_name }} -q .id)
          gh api -X PATCH /repos/${{ github.repository }}/releases/$RELEASE_ID \
            -F body="$NOTES"
