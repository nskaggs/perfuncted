name: Release

on:
  push:
    tags:
      - 'v*'
      - '!v*-rc*'
      - '!v*-alpha*'
      - '!v*-beta*'
      - '!v*-pre*'
      - '!v*-dev*'

permissions:
  contents: write

jobs:
  quality:
    name: Deterministic quality gates
    uses: ./.github/workflows/quality.yml

  release:
    needs: quality
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Detect prerelease tag
        id: prerelease
        run: |
          case "${{ github.ref_name }}" in
            *-rc*|*-alpha*|*-beta*|*-pre*|*-dev*)
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Record release commit and completed gates
        run: |
          commit="$(git rev-parse HEAD)"
          echo "Release commit: ${commit}"
          {
            echo "### Release gates"
            printf -- '- Commit: `%s`\n' "$commit"
            echo "- Deterministic quality: passed"
            echo "- Environment-dependent Flatpak smoke: pending"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Flatpak tooling
        if: ${{ steps.prerelease.outputs.prerelease != 'true' }}
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y flatpak libgdk-pixbuf2.0-bin libgdk-pixbuf-2.0-0 librsvg2-common xvfb xterm openbox kwin-wayland gnome-shell x11-utils xdotool sway foot

      - name: Verify real native KDE Wayland migration workflows
        if: ${{ steps.prerelease.outputs.prerelease != 'true' }}
        run: |
          kwin_major="$(kwin_wayland --version 2>&1 | sed -n 's/^kwin \([0-9][0-9]*\)\..*/\1/p' | head -1)"
          if [ -z "$kwin_major" ]; then kwin_major=0; fi
          if [ "$kwin_major" -lt 6 ]; then
            echo "KWin 6+ is required for the native desktop acceptance gate, got $kwin_major" >&2
            exit 1
          fi
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/pf-kde-e2e" ./cmd/pf
          PF_KDE_CLI_BINARY="$RUNNER_TEMP/pf-kde-e2e" bash scripts/verify-kde-wayland-automation.sh

      - name: Fetch pinned previous release for upgrade test
        if: ${{ steps.prerelease.outputs.prerelease != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/pf-previous"
          gh release download v1.2.3 --repo nskaggs/perfuncted --pattern perfuncted.flatpak --dir "$RUNNER_TEMP/pf-previous"
          echo "5607b377e502c968db1458260d37afb6dd50afc30b6ad5a784c3f7741f844f87  $RUNNER_TEMP/pf-previous/perfuncted.flatpak" | sha256sum -c -
          echo "PF_FLATPAK_PREVIOUS_BUNDLE=$RUNNER_TEMP/pf-previous/perfuncted.flatpak" >> "$GITHUB_ENV"

      - name: Build Flatpak bundle
        if: ${{ steps.prerelease.outputs.prerelease != 'true' }}
        env:
          CGO_ENABLED: "0"
          PF_FLATPAK_DESKTOP_TARGET: kde,gnome
          PF_FLATPAK_REQUIRE_UPGRADE: "1"
          PF_FLATPAK_EXPORT_BUNDLE: ${{ runner.temp }}/perfuncted.flatpak
        run: go test -tags=integration ./flatpaktest -count=1 -v -timeout=60m

      - name: Record completed environment gate
        if: ${{ steps.prerelease.outputs.prerelease != 'true' }}
        run: 'echo "- Environment-dependent Flatpak smoke: passed" >> "$GITHUB_STEP_SUMMARY"'

      - name: Verify installed Flatpak status and native Wayland authority boundaries
        if: ${{ steps.prerelease.outputs.prerelease != 'true' }}
        env:
          PF_FLATPAK_TEST_BUNDLE: ${{ runner.temp }}/perfuncted.flatpak
          PF_FLATPAK_WLROOTS_TEST: "1"
        run: go test -tags=integration ./flatpaktest -run '^TestFlatpakPrebuiltWlrootsCapabilityAndEffects$' -count=1 -v -timeout=15m

      - name: Confirm verified Flatpak artifact
        if: ${{ steps.prerelease.outputs.prerelease != 'true' }}
        run: |
          test -s "$RUNNER_TEMP/perfuncted.flatpak"
          sha256sum "$RUNNER_TEMP/perfuncted.flatpak"

      - name: Run GoReleaser
        if: ${{ steps.prerelease.outputs.prerelease != 'true' }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach Flatpak bundle to release
        if: ${{ steps.prerelease.outputs.prerelease != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" "$RUNNER_TEMP/perfuncted.flatpak" --clobber

      - name: Generate GitHub release notes
        if: ${{ steps.prerelease.outputs.prerelease != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes_path=".github/release-notes/${{ github.ref_name }}.md"
          if [[ -f "$notes_path" ]]; then
            NOTES="$(cat "$notes_path")"
          else
            NOTES=$(gh api -X POST \
              /repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name="${{ github.ref_name }}" \
              -q .body)
          fi
          RELEASE_ID=$(gh api /repos/${{ github.repository }}/releases/tags/${{ github.ref_name }} -q .id)
          gh api -X PATCH /repos/${{ github.repository }}/releases/$RELEASE_ID \
            -F body="$NOTES"
