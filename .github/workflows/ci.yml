name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  performance:
    name: Race & Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true
      - uses: ./.github/actions/install-desktop-dependencies
      - name: Run race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -short ./...
      - name: Run core benchmarks
        run: go test ./find -run '^$' -bench 'Pixel(Hash|Found)' -benchmem -count=5 | tee benchmarks.txt
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260615155930-9e4b9ddef5b6
      - name: Record benchmark stack
        run: |
          {
            go version
            go env GOOS GOARCH GOTOOLCHAIN GOWORK
            go list -m all
          } | tee benchmark-environment.txt
      - name: Run real desktop benchmarks
        run: |
          go test -tags=desktopbench . -run '^$' \
            -bench '^BenchmarkDesktop(OpenClose|RegionHash|InputClickType|WindowListActivate|AccessibilitySnapshot|AccessibilityAction)$' \
            -benchmem -benchtime=3x -count=3 -v | tee desktop-benchmarks.txt
      - name: Compare desktop benchmark distributions
        run: |
          "$(go env GOPATH)/bin/benchstat" \
            benchmarks/desktop-baseline.txt desktop-benchmarks.txt | tee desktop-benchstat.txt
      - name: Check desktop benchmark regression budget
        run: |
          go run ./scripts/check_benchmark_regression \
            -baseline benchmarks/desktop-baseline.txt \
            -current desktop-benchmarks.txt \
            -max-regression 0.50
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmarks.txt
            desktop-benchmarks.txt
            desktop-benchstat.txt
            benchmark-environment.txt

  quality:
    name: Build & Quality
    uses: ./.github/workflows/quality.yml

  integration-suite:
    name: Integration (${{ matrix.display }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        display:
          - headless-x11
          - nested-x11
          - headless-wayland
          - nested-wayland
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/install-desktop-dependencies
      - name: Run Integration Tests
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: just test-integration-suite "${{ matrix.display }}"
      - name: Upload integration logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-${{ matrix.display }}
          path: /tmp/perfuncted-logs/**/*.log
          if-no-files-found: ignore

  accessibility-certification:
    name: AT-SPI Certification (Headless Wayland)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
      options: --privileged
    steps:
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            sway xwayland dbus-x11 at-spi2-core libatk-bridge2.0-0t64 \
            libwayland-client0 libwayland-server0 wl-clipboard xdg-utils \
            qtwayland5 qt6-wayland kwrite gnome-text-editor ca-certificates git
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true
      - uses: taiki-e/install-action@just
      - name: Run strict accessibility certification
        run: just test-accessibility-certification
      - name: Upload certification logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-certification-logs
          path: /tmp/perfuncted-logs/**/*.log
          if-no-files-found: ignore

  integration-session:
    name: Integration (Session Lifecycle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/install-desktop-dependencies
      - name: Run Session Lifecycle Test
        run: just test-session
      - name: Upload integration logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-session
          path: /tmp/perfuncted-logs/**/*.log
          if-no-files-found: ignore

  integration-backends:
    name: Integration (Backends)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/install-desktop-dependencies
      - name: Run Backend Integration Tests
        run: just test-integration-backends
      - name: Upload integration logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-backends
          path: /tmp/perfuncted-logs/**/*.log
          if-no-files-found: ignore

  release-smoke:
    name: Release Smoke Test
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/install-desktop-dependencies
        with:
          packages: |
            sway
            xwayland
            dbus-x11
            libwayland-client0
            libwayland-server0
            wl-clipboard
            xdg-utils
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: build --snapshot --clean --single-target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Release Smoke Tests
        run: |
          BIN=$(find dist/ -name 'pf' -type f | head -1)
          echo "Testing binary: $BIN"
          just test-release-binary "$BIN"
