name: Flatpak

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '!v*-rc*'
      - '!v*-alpha*'
      - '!v*-beta*'
      - '!v*-pre*'
      - '!v*-dev*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Build and validate bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y flatpak xvfb xterm openbox kwin-wayland gnome-shell

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true

      - name: Run Flatpak integration tests
        env:
          PF_FLATPAK_DESKTOP_TARGET: kde,gnome
        run: go test -tags=integration ./flatpaktest -count=1 -v -timeout=60m

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: perfuncted-flatpak
          path: dist/flatpak/perfuncted.flatpak
          if-no-files-found: error
