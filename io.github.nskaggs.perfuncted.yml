app-id: io.github.nskaggs.perfuncted
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: pf
default-branch: stable
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.gnome.Shell
  - --talk-name=org.kde.KWin
modules:
  - name: perfuncted
    buildsystem: simple
    build-options:
      env:
        CGO_ENABLED: '0'
        GOROOT: /usr/lib/sdk/golang
        GOTOOLCHAIN: 'local'
    build-commands:
      - sh scripts/flatpak-build.sh
      - install -Dm0644 LICENSE "${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/perfuncted/LICENSE"
      - install -Dm0644 flatpak/io.github.nskaggs.perfuncted.metainfo.xml "${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml"
      - install -Dm0644 flatpak/io.github.nskaggs.perfuncted-128.png "${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png"
    sources:
