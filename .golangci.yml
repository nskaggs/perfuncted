version: "2"

run:
  modules-download-mode: readonly
  tests: true

linters:
  disable: []
  enable:
    - bodyclose
    - containedctx
    - contextcheck
    - dupl
    - errorlint
    - gocritic
    - gocyclo
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
  settings:
    dupl:
      threshold: 150
    errcheck:
      check-type-assertions: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    gocritic:
      disabled-checks:
        - captLocal
      enabled-checks:
        - badLock
        - deferInLoop
        - dupImport
        - indexAlloc
        - sloppyReassign
        - unnecessaryBlock
        - unnecessaryDefer
    gocyclo:
      min-complexity: 15
    govet:
      enable:
        - nilness
        - shadow
        - unmarshal
        - unreachable
        - unusedresult
    revive:
      rules:
        - name: exported
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-naming
        - name: early-return
        - name: increment-decrement
        - name: receiver-naming
        - name: time-naming
        - name: var-naming
        - name: indent-error-flow
        - name: unexported-return
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Synthetic test fixtures deliberately create complex protocol/cancellation
      # cases. Keep production checks strict; tests still run go vet, race and
      # static analysis, but do not enforce maintainability heuristics on fixtures.
      - path: '_test[.]go$'
        linters: [gocyclo, dupl, containedctx]
      # Nil-context tests must pass nil to validate our fail-closed API behavior.
      # The other listed checks are style suggestions in adversarial fixtures.
      - path: '_test[.]go$'
        linters: [staticcheck]
        text: 'SA1012|SA1029|SA4016|QF100'
      # Short-lived callbacks in test fixtures intentionally capture synthetic
      # contexts; cancellation inheritance is what these tests exercise.
      - path: '_test[.]go$'
        linters: [contextcheck]
        text: 'Non-inherited new context'
      # Test fixtures use scoped shadow variables to check independent error
      # branches; the standard go vet checks remain enabled for all Go code.
      - path: '_test[.]go$'
        linters: [govet]
        text: 'shadow:'
      - linters:
          - revive
        text: TODO
      - linters:
          - unparam
        text: interface method
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
